const CONFIG = {"family":"Explorer's Field Journal","genre":"Practice quiz · from My Life With the Chimpanzees (Savvas pages 136 to 148)","code":"FJ-DAY-3","short":"Day 3: Tone, Word Choice, and Figurative Language","color":"#2f6f7a","emoji":"🔎","sticker":{"e":"🔎","n":"Word Tracker"},"title":"Field Journal, Day 3","stds":[{"c":"ELA.6.R.3.1","t":"Explain how figurative language contributes to tone and meaning in text(s)."},{"c":"ELA.6.R.2.2","t":"Analyze the central idea(s), implied or explicit, and its development throughout a text."},{"c":"ELA.6.V.1.3","t":"Apply knowledge of context clues, figurative language, word relationships, reference materials, and/or background knowledge to determine the connotative and denotative meaning of words and phrases, appropriate to grade level."},{"c":"ELA.K12.EE.2.1","t":"Read and comprehend grade-level complex texts proficiently."}],"kid":"Notice word choice and punctuation, explain tone and figurative language, and tell why details matter.","tips":["Keep your Savvas book open to pages 142 to 148.","Tone is the writer's attitude. Look at word choice and punctuation.","Ask: What feeling do these words give me?"],"passages":[{"title":"Your Field Journal Guide","genre":"Day 3 · Savvas pages 142 to 148","blocks":[{"t":"note","x":"Open your Savvas book to pages 142 to 148 (paragraphs 18 to 61). Keep it open."},{"t":"h","x":"Today's skills"},{"t":"box","title":"Skills","x":"• Tone and word choice • Figurative language (comparisons and phrases that are not literal) • Punctuation that shows feeling • Why an author includes certain details"},{"t":"h","x":"Field notes"},{"t":"note","x":"Tone words: tense, humorous, excited, frustrated, wondering. Find the words that give the clue."},{"t":"note","x":"A comparison can add humor, fear, or wonder. Ask what it makes you picture."}]}],"items":[{"type":"ebsr","stem":"","parts":[{"stem":"Which word best describes the tone of paragraphs 19 through 22, when Goodall meets the buffalo and the leopard?","options":["Cheerful and carefree","Angry and bitter","Bored and distant","Tense and cautious"],"correct":3},{"stem":"Which detail best supports the answer to Part A?","options":["The leopard left its droppings where Goodall had been sitting.","The buffalo was peacefully chewing his cud with his back turned.","Her heart began to beat fast, and she stood quite still.","She kept a kettle and some coffee in a little tin trunk."],"correct":2}],"explain":"Words like heart began to beat fast and stood quite still show fear and care. That creates a tense, cautious tone."},{"type":"mc","stem":"In paragraph 32, why does Goodall end the sentence about the chimpanzee's visit with an exclamation point?","options":["To warn readers that chimpanzees are very dangerous animals","To show her excitement after months of chimpanzees running away","To ask the reader a question about the chimpanzee's visit","To show that she was angry with Dominic for leaving the tent"],"correct":1,"explain":"After months of the chimps running off, a visit to her camp was big news. The exclamation point shows her excitement."},{"type":"mc","stem":"In paragraph 48, Goodall writes that the tent looked as though “some burglar had raided the place!” What does this comparison add?","options":["Sadness, by showing that her camp had been completely destroyed","Fear, by suggesting that a real burglar had broken into her camp","Anger, by blaming David Greybeard for stealing from her tent","Humor, by showing the mess David made while searching for bananas"],"correct":3,"explain":"She compares the mess to a burglar's work, but she is joking. It shows how determined David was and adds a light, humorous tone."},{"type":"match","stem":"Match each line to the effect it has on tone or meaning.","rows":["“He had actually made a tool.” (paragraph 39)","“Nor the day after. Nor the day after that.” (paragraph 8)","“I was surrounded.” (paragraph 42)","“I just prayed and pulled the blanket over my head!” (paragraph 24)"],"cols":["Builds fear and tension","Adds humor","Shows wonder at a discovery","Shows growing frustration"],"correct":[2,3,0,1],"explain":"The tool line shows wonder. The repeated Nor lines show frustration. The short sentence I was surrounded builds fear. Pulling the blanket over her head adds humor."},{"type":"mc","stem":"Why does Goodall describe the personalities of individual chimpanzees in paragraphs 48 and 49?","options":["To explain why the research camp had to be moved to a new place","To show that Goodall disliked several of the chimpanzees she met","To help readers see the chimps as individuals with their own traits","To prove that chimpanzees are much less clever than baboons are"],"correct":2,"explain":"By telling who is calm, excitable, or shy, she shows that each chimp is a recognizable individual, not just part of a group."},{"type":"mc","stem":"In paragraph 48, Goliath is described as having an excitable, impetuous temperament, while William is shy and timid. Which word is closest in meaning to impetuous?","options":["Timid","Gentle","Patient","Hasty"],"correct":3,"explain":"The sentence contrasts impetuous Goliath with shy, timid William. Hasty, or acting quickly without thinking, fits an excitable chimp."},{"type":"mc","stem":"What do paragraphs 60 and 61 suggest about Goodall's work?","options":["It grew from a small camp into a research center over six years.","It lost importance once students arrived to collect information.","It ended when the game ranger returned and closed the camp.","It stayed small because Goodall chose to work completely alone."],"correct":0,"explain":"She says a little camp for her and her mother became, six years later, a research center where students collected information. The work kept growing."}]};

const settings = Object.assign({ rate: 1, auto: false, fs: 1 }, (()=>{ try { return JSON.parse(lsGet("g6ela.settings")||"{}"); } catch(e){ return {}; } })());

function freshRec(){ return { ans:{}, flags:{}, strike:{}, idx:0, status:"new", res:null, write:{ plan:["","",""], text:"", self:{} } }; }

function loadPlayer(name){

  try { const d = JSON.parse(raw);
    state.r = Object.assign(freshRec(), d.r || {}); state.badges = d.badges || []; state.usedTTS = !!d.usedTTS; state.savedAt = d.savedAt || null; state.name = d.name || name; return true;
  } catch(e){ return false; }
}

/* ===== Helpers ===== */
const app = document.getElementById("app"), hud = document.getElementById("hud"), toastEl = document.getElementById("toast");
const REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>"); }
function isDone(){ return !!(state.r && state.r.status === "done" && state.r.res); }
function pct(){ return isDone() ? Math.round(state.r.res.pts / state.r.res.max * 100) : 0; }
function starsOf(p){ return p >= 95 ? 3 : p >= 80 ? 2 : 1; }
function starIcons(n){ return "⭐".repeat(n); }
function xpOf(res){ return res.pts * 5 + 50; }
function rankIdxOf(p){ let i = 0; RANKS.forEach((r,n)=>{ if (p >= r.p) i = n; }); return i; }
function curRank(){ return isDone() ? RANKS[rankIdxOf(pct())] : RANKS[0]; }
function stdCodes(){ return CONFIG.stds.map(s=>s.c).join(", "); }
function stdListHTML(){ return `<ul class="std">${CONFIG.stds.map(s=>`<li><b>${esc(s.c)}</b> ${esc(s.t)}</li>`).join("")}</ul>`; }

const toastQ = []; let toastBusy = false;
function toast(msg){ toastQ.push(msg); if (!toastBusy) nextToast(); }
function nextToast(){
  const m = toastQ.shift(); if (!m){ toastBusy = false; return; }
  toastBusy = true; toastEl.textContent = m; toastEl.classList.add("show");
  setTimeout(()=>{ toastEl.classList.remove("show"); setTimeout(nextToast, 300); }, 2800);
}
function confetti(n){
  if (REDUCED) return;
  const bits = ["🎉","⭐","✨","💜","💛","🩷"];
  for (let i=0;i<n;i++){
    const s = document.createElement("span"); s.className = "cf"; s.textContent = bits[Math.floor(Math.random()*bits.length)];
    s.style.setProperty("--dx", (Math.random()*560-280)+"px"); s.style.setProperty("--dy", (-120-Math.random()*320)+"px"); s.style.setProperty("--r", (Math.random()*720-360)+"deg");
    s.style.animationDelay = (Math.random()*0.15)+"s"; document.body.appendChild(s); setTimeout(()=>s.remove(), 1700);
  }
}
function checkBadges(){ BADGES.forEach(b=>{ if (!state.badges.includes(b.id) && b.ok()){ state.badges.push(b.id); toast(`${b.e} New badge: ${b.n}!`); } }); }
function afterProgress(){ checkBadges(); save(); }

/* ===== Passage blocks ===== */
function numberedBlocks(pi){
  const out = []; let n = 0;
  PASSAGES[pi].blocks.forEach(b=>{
    if (Array.isArray(b)){ n++; out.push({ n, kind:"p", lines:b }); }
    else if (b.t === "poem"){ n++; out.push({ n, kind:"poem", lines:[].concat(...b.stanzas), b }); }
  });
  return out;
}
function sentencesOf(pi, n){ const nb = numberedBlocks(pi).find(x=>x.n===n); return nb ? nb.lines : []; }
function passageHTML(it, r){
  const hotPi = it && it.type === "hot" ? (it.pass||0) : -1, hotN = it && it.type === "hot" ? it.para : 0;
  const sel = it && it.type === "hot" && Array.isArray(r.ans[r.idx]) ? r.ans[r.idx] : [];
  return PASSAGES.map((P,pi)=>{
    let n = 0;
    const head = (PASSAGES.length > 1 ? `<h3 class="pt">Passage ${pi+1}: ${esc(P.title)}</h3>` : "") + (P.byline ? `<p class="note">${esc(P.byline)}</p>` : "");
    const body = P.blocks.map(b=>{
      if (Array.isArray(b)){
        n++; const hot = pi === hotPi && n === hotN;
        const inner = hot ? b.map((s,si)=>`<button class="sent${sel.includes(si)?" on":""}" data-act="hot" data-s="${si}" aria-pressed="${sel.includes(si)}">${fmt(s)}</button>`).join(" ") : fmt(b.join(" "));
        return `<p class="para"><span class="pn" aria-label="Paragraph ${n}">${n}</span>${inner}</p>`;
      }
      if (b.t === "h") return `<h3 class="bh">${fmt(b.x)}</h3>`;
      if (b.t === "note") return `<p class="note">${fmt(b.x)}</p>`;
      if (b.t === "fig") return `<figure class="fig"><div class="figi" aria-hidden="true">${b.e}</div><figcaption>${fmt(b.x)}</figcaption></figure>`;
      if (b.t === "box") return `<aside class="box"><b>${fmt(b.title)}</b><p>${fmt(b.x)}</p></aside>`;
      if (b.t === "poem"){
        n++; const hot = pi === hotPi && n === hotN; let li = -1;
        const stz = b.stanzas.map(st=>`<div class="stz">` + st.map(line=>{ li++; return hot ? `<button class="ln sent${sel.includes(li)?" on":""}" data-act="hot" data-s="${li}" aria-pressed="${sel.includes(li)}">${fmt(line)}</button>` : `<span class="ln">${fmt(line)}</span>`; }).join("") + `</div>`).join("");
        return `<div class="poem"><span class="pn" aria-label="Poem ${n}">${n}</span><div class="pt2">${fmt(b.title)}</div>${stz}</div>`;
      }
      return "";
    }).join("");
    return head + body;
  }).join("");
}
function blockSpeech(b, st){
  if (Array.isArray(b)){ st.n++; return `Paragraph ${st.n}. ${plain(b.join(" "))} `; }
  if (b.t === "h") return plain(b.x) + ". ";
  if (b.t === "note") return plain(b.x) + ". ";
  if (b.t === "fig") return "Picture. " + plain(b.x) + " ";
  if (b.t === "box") return plain(b.title) + ". " + plain(b.x) + " ";
  if (b.t === "poem"){ st.n++; return `Poem ${st.n}. ${plain(b.title)}. ` + b.stanzas.map(s=>s.map(plain).join(", ")).join(". ") + ". "; }
  return "";
}
function passageSpeech(){
  return PASSAGES.map((P,pi)=>{ const st = { n:0 }; return (PASSAGES.length>1 ? `Passage ${pi+1}. ` : "") + plain(P.title) + ". " + P.blocks.map(b=>blockSpeech(b, st)).join(""); }).join(" ");
}

/* ===== Scoring: reading ===== */
function scoreItem(it, a){
  switch (it.type){
    case "mc": return { pts: a === it.correct ? 2 : 0, max: 2 };
    case "ms": case "hot": { const ok = Array.isArray(a) && a.length === it.correct.length && a.every(x=>it.correct.includes(x)); return { pts: ok?2:0, max: 2 }; }
    case "ebsr": { const p = it.parts.map((pt,i)=> a && a[i] === pt.correct ? 1 : 0); return { pts: p[0]+p[1], max: 2 }; }
    case "match": { const ok = Array.isArray(a) && it.correct.every((c,i)=>a[i] === c); return { pts: ok?2:0, max: 2 }; }
  }
  return { pts: 0, max: 2 };
}
function isAnswered(it, a){
  if (a == null) return false;
  switch (it.type){
    case "mc": return typeof a === "number";
    case "ms": return Array.isArray(a) && a.length === it.n;
    case "ebsr": return typeof a[0] === "number" && typeof a[1] === "number";
    case "match": return Array.isArray(a) && it.rows.every((_,i)=>typeof a[i] === "number");
    case "hot": return Array.isArray(a) && a.length === (it.n||1);
  }
  return false;
}
function answeredCount(){ return ITEMS.filter((it,i)=>isAnswered(it, state.r.ans[i])).length; }
function gradeReading(){
  let pts = 0, max = 0; const items = [];
  ITEMS.forEach((it,i)=>{ const s = scoreItem(it, state.r.ans[i]); pts += s.pts; max += s.max; items.push(s.pts); });
  return { pts, max, items, ans: JSON.parse(JSON.stringify(state.r.ans)), at: Date.now() };
}
function ansText(it, a){
  const none = "(no answer)";
  switch (it.type){
    case "mc": return typeof a === "number" ? `${L[a]}. ${it.options[a]}` : none;
    case "ms": return Array.isArray(a) && a.length ? a.slice().sort().map(i=>`${L[i]}. ${it.options[i]}`).join("  |  ") : none;
    case "ebsr": return it.parts.map((p,i)=>`Part ${"AB"[i]}: ${a && typeof a[i]==="number" ? L[a[i]]+". "+p.options[a[i]] : none}`).join("  |  ");
    case "match": return it.rows.map((r,i)=>`${r} → ${a && typeof a[i]==="number" ? it.cols[a[i]] : none}`).join("  |  ");
    case "hot": { const s = sentencesOf(it.pass||0, it.para); return Array.isArray(a) && a.length ? a.map(k=>s[k]).join(" ") : none; }
  }
  return none;
}
function correctText(it){
  switch (it.type){
    case "mc": return `${L[it.correct]}. ${it.options[it.correct]}`;
    case "ms": return it.correct.map(i=>`${L[i]}. ${it.options[i]}`).join("  |  ");
    case "ebsr": return it.parts.map((p,i)=>`Part ${"AB"[i]}: ${L[p.correct]}. ${p.options[p.correct]}`).join("  |  ");
    case "match": return it.rows.map((r,i)=>`${r} → ${it.cols[it.correct[i]]}`).join("  |  ");
    case "hot": { const s = sentencesOf(it.pass||0, it.para); return it.correct.map(k=>s[k]).join(" "); }
  }
  return "";
}

/* ===== Scoring: writing (checks what a computer can see) ===== */
const LISTS = {
  transitions: ["first","second","third","next","then","finally","in addition","also","for example","for instance","another","furthermore","however","because","as a result","therefore","in conclusion","overall","in summary","similarly","most importantly","for this reason","one way","another way","additionally","in fact","this means","so that","since"],
  timewords: ["first","then","next","after","before","suddenly","finally","later","meanwhile","soon","at last","until","when","as soon as","by the time","that night","the next day","moments later","at that moment","just then"],
  vivid: ["gleaming","whispered","crashed","echoed","trembled","glowed","shimmering","scorching","icy","damp","creaked","thundered","drifted","sparkled","muttered","shrieked","hissed","rumbled","jagged","brittle","musty","fragrant","sticky","velvet","pounding","flickered","stumbled","gasped","glimmer","dusty","murky","roared","sizzled","bitter","salty","freezing","blazing","trembling","giggled","sprinted"],
  reasons: ["because","for one reason","first","second","another reason","one reason","in addition","also","since","this shows","for example","for instance","as a result","this means"]
};
function countWords(s){ return (String(s).match(/[A-Za-z0-9][A-Za-z0-9’'-]*/g) || []).length; }
function norm(s){ return String(s).toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim(); }
function sourceText(){ return PASSAGES.map(P=>P.blocks.map(b=>Array.isArray(b)?b.join(" "):(b.x||"")).join(" ")).join(" "); }
function gradeWriting(){
  const w = state.r.write, text = (w.text || "").trim(), words = countWords(text);
  const paras = text.split(/\n+/).map(s=>s.trim()).filter(Boolean), low = text.toLowerCase();
  const src = norm(sourceText()).split(" "), mine = norm(text).split(" ");
  const sh = new Set(); for (let i=0;i+8<=src.length;i++) sh.add(src.slice(i,i+8).join(" "));
  let copied = false; for (let i=0;i+8<=mine.length;i++){ if (sh.has(mine.slice(i,i+8).join(" "))){ copied = true; break; } }
  const checks = CONFIG.checks.map(c=>{
    let ok = false, note = "";
    if (c.k === "words"){ ok = words >= c.min; note = `You wrote ${words} words.`; }
    else if (c.k === "paras"){ ok = paras.length >= c.min; note = `You wrote ${paras.length} paragraph${paras.length===1?"":"s"}. Press Enter to start a new paragraph.`; }
    else if (c.k === "kw"){ const f = c.list.filter(k=>low.indexOf(k) > -1); ok = f.length >= c.min; note = f.length ? `Found: ${f.join(", ")}.` : "None found."; }
    else if (c.k === "list"){ const arr = typeof c.list === "string" ? LISTS[c.list] : c.list; const f = arr.filter(k=>new RegExp("\\b"+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i").test(text)); ok = f.length >= c.min; note = f.length ? `Found: ${f.join(", ")}.` : "None found."; }
    else if (c.k === "re"){ const scope = c.where === "last" ? (paras[paras.length-1]||"") : c.where === "first" ? (paras[0]||"") : text; const m = scope.match(new RegExp(c.pattern, (c.flags||"i")+"g")) || []; ok = m.length >= (c.min||1) && (!c.minParas || paras.length >= c.minParas); note = ok ? `Found ${m.length}.` : "Not found yet."; }
    else if (c.k === "nocopy"){ ok = words >= 40 && !copied; note = words < 40 ? "Write more so this can be checked." : copied ? "Part of your writing matches the sources word for word." : "No copied phrases found."; }
    return { ok, label: c.label, note };
  });
  const pts = checks.filter(c=>c.ok).length;
  return { pts, max: checks.length, checks, words, paragraphs: paras.length, text, plan: w.plan.slice(), at: Date.now() };
}

/* ===== Read aloud ===== */
const synth = window.speechSynthesis || null;
function plain(html){
  const d = document.createElement("div"); d.innerHTML = String(html).replace(/\*\*/g,"").replace(/➜/g," then ").replace(/→/g," matches ");
  return d.textContent.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu,"").replace(/\s+/g," ").trim();
}
function pickVoice(){
  if (!synth) return null; const vs = synth.getVoices(); if (!vs.length) return null;
  const en = vs.filter(v=>/^en[-_]US/i.test(v.lang));
  for (const p of ["Google US English","Samantha","Ava","Allison","Nicky"]){ const f = en.find(v=>v.name.indexOf(p)>-1); if (f) return f; }
  return en[0] || vs.find(v=>/^en/i.test(v.lang)) || null;
}
function stopSpeech(){ if (synth){ try { synth.cancel(); } catch(e){} } }
function speak(text){
  if (!synth || typeof SpeechSynthesisUtterance === "undefined"){ toast("🔇 Read-aloud is not available in this browser."); return; }
  stopSpeech();
  text = text.replace(/([.?!:”"])\s*\.(\s|$)/g, "$1$2");
  const chunks = (text.match(/[^.!?]+[.!?]*["”’)]*/g) || [text]).map(s=>s.trim()).filter(Boolean);
  const v = pickVoice();
  chunks.forEach(c=>{ const u = new SpeechSynthesisUtterance(c); u.rate = settings.rate; u.lang = "en-US"; if (v) u.voice = v; synth.speak(u); });
  if (!state.usedTTS){ state.usedTTS = true; afterProgress(); }
}
function questionSpeech(i){
  const it = ITEMS[i], opts = o => o.map((x,k)=>`${L[k]}. ${plain(x)}.`).join(" ");
  const head = `Question ${i+1}. `;
  switch (it.type){
    case "mc": return head + plain(it.stem) + " " + opts(it.options);
    case "ms": return head + plain(it.stem) + ` Select ${["","one","two","three"][it.n]} answers. ` + opts(it.options);
    case "ebsr": return head + it.parts.map((p,pi)=>`Part ${"AB"[pi]}. ${plain(p.stem)} ${opts(p.options)}`).join(" ");
    case "match": return head + plain(it.stem) + " The choices are: " + it.cols.join(", ") + ". " + it.rows.map((r,k)=>`Row ${k+1}. ${plain(r)}`).join(" ");
    case "hot": return head + plain(it.stem) + " Tap a sentence in the passage.";
  }
  return head;
}

function optsHTML(opts, sel, multi, i, p, strike){
  return `<div class="fopts" role="${multi?"group":"radiogroup"}">` + opts.map((o,k)=>{
    const on = sel.includes(k), cr = strike.includes(k);
    return `<div class="frow"><button class="fopt${on?" on":""}${cr?" cross":""}" data-act="pick" data-i="${i}" data-p="${p}" data-o="${k}" role="${multi?"checkbox":"radio"}" aria-checked="${on}">
      <span class="ind ${multi?"sq":"ci"}">${on ? (multi?"✓":"●") : ""}</span><span class="lt">${L[k]}.</span><span class="ot">${fmt(o)}</span></button>
      <button class="xs" data-act="strike" data-i="${i}" data-p="${p}" data-o="${k}" aria-label="Cross out answer ${L[k]}" title="Cross out">✂</button></div>`;
  }).join("") + `</div>`;
}
function controlsHTML(i){
  const r = state.r, it = ITEMS[i], a = r.ans[i];
  if (it.type === "mc") return `<div class="stem">${fmt(it.stem)}</div>` + optsHTML(it.options, typeof a === "number" ? [a] : [], false, i, 0, r.strike[i+".0"]||[]);
  if (it.type === "ms") return `<div class="stem">${fmt(it.stem)}</div><p class="inst">Select ${["","ONE","TWO","THREE"][it.n]} answers.</p>` + optsHTML(it.options, Array.isArray(a)?a:[], true, i, 0, r.strike[i+".0"]||[]);
  if (it.type === "ebsr") return it.parts.map((p,pi)=>`<div class="part"><h3>Part ${"AB"[pi]}</h3><div class="stem">${fmt(p.stem)}</div>` +
      optsHTML(p.options, a && typeof a[pi] === "number" ? [a[pi]] : [], false, i, pi, r.strike[i+"."+pi]||[]) + `</div>`).join("");
  if (it.type === "match"){
    const sel = Array.isArray(a) ? a : [];
    return `<div class="stem">${fmt(it.stem)}</div><div class="mtwrap"><table class="mt"><thead><tr><th scope="col"><span class="small">Item</span></th>${it.cols.map(c=>`<th scope="col">${esc(c)}</th>`).join("")}</tr></thead><tbody>` +
      it.rows.map((row,ri)=>`<tr><th scope="row">${fmt(row)}</th>${it.cols.map((c,ci)=>{
        const on = sel[ri] === ci;
        return `<td><button class="cell${on?" on":""}" data-act="cell" data-i="${i}" data-r="${ri}" data-c="${ci}" role="radio" aria-checked="${on}" aria-label="${esc(row)}: ${esc(c)}">✓</button></td>`;
      }).join("")}</tr>`).join("") + `</tbody></table></div>`;
  }
  if (it.type === "hot"){
    const sel = Array.isArray(a) ? a : [], s = sentencesOf(it.pass||0, it.para);
    return `<div class="stem">${fmt(it.stem)}</div><p class="inst">Tap a sentence or line in ${PASSAGES.length>1 ? "Passage " + ((it.pass||0)+1) + ", " : ""}number ${it.para} of the passage to select it.</p>
      <div class="hotbox">${sel.length ? fmt(sel.map(k=>s[k]).join(" ")) : "<span class='small'>Nothing selected yet.</span>"}</div>`;
  }
  return "";
}

function resultsText(){

  lines.push(`Score: ${g.pts}/${g.max} (${pct()}%) · ${starsOf(pct())} star(s) · ${curRank().n} · ${xpOf(g)} XP`);
  if (IS_W){
    lines.push(`Writing checklist: ${g.words} words, ${g.paragraphs} paragraphs; missed: ${g.checks.filter(c=>!c.ok).map(c=>c.label.split(":")[0]).join(", ") || "none"}`, "", "Student writing:", g.text);

/* ===== Render ===== */
function render(opts){
  opts = opts || {};
  stopSpeech();
  const pp = document.querySelector(".ppane"), qp = document.querySelector(".qpane");
  const ps = pp ? pp.scrollTop : 0, qs = qp ? qp.scrollTop : 0;
  hud.innerHTML = hudHTML();
  const v = state.view;
  let html = v==="welcome" ? welcomeView() : v==="home" ? homeView() : v==="directions" ? directionsView() : v==="test" ? testView() : v==="review" ? reviewView() : v==="reward" ? rewardView() : v==="cert" ? certView() : resultsView();
  if (state.showSettings && v !== "welcome" && v !== "cert") html = settingsHTML() + html;
  app.innerHTML = html;
  if (v === "test"){
    const np = document.querySelector(".ppane"), nq = document.querySelector(".qpane");
    if (np && opts.keepPane) np.scrollTop = ps;
    if (nq && opts.keepQ) nq.scrollTop = qs;
  }
  if (!opts.keepScroll) window.scrollTo(0, 0);
  if (v === "test" && opts.nav){
    const h = document.getElementById("qh"); if (h) h.focus({preventScroll:true});
    if (!IS_W){
      if (settings.auto) speak(questionSpeech(state.r.idx));
    }
  }
}
function pickRender(){ save(); render({ keepScroll:true, keepPane:true, keepQ:true }); }
function nav(i){ state.r.idx = i; state.view = "test"; save(); render({ nav:true, keepPane:true }); }

function beginPlayer(name){
  state.name = name.trim().replace(/\s+/g," ");
  state.r = freshRec(); state.badges = []; state.usedTTS = false; state.savedAt = null;
  const loaded = loadPlayer(state.name);
  lsSet(GNAME, state.name);
  state.view = "home"; state.showSettings = false; state.welcomeMsg = ""; state.reward = null;
  save(); render();
  toast(loaded ? `👋 Welcome back, ${state.name}! Your progress is loaded.` : `🎉 Welcome, ${state.name}!`);
}
function submitMission(){
  const r = state.r; if (r.status === "done") return;       // one try only
  r.res = IS_W ? gradeWriting() : gradeReading();
  r.status = "done";
  state.reward = { xp: xpOf(r.res) };
  state.confirmSubmit = false; state.view = "reward";
  afterProgress(); render(); confetti(34);
}
function copyResults(){
  const txt = resultsText(), msg = document.getElementById("cp"), ta = document.getElementById("rt");
  const ok = ()=>{ if (msg) msg.textContent = "✅ Copied!"; };
  const fallback = ()=>{ ta.removeAttribute("readonly"); ta.focus(); ta.select(); ta.setSelectionRange(0, txt.length);
    let done = false; try { done = document.execCommand("copy"); } catch(e){}
    done ? ok() : (msg.textContent = "👆 Press and hold the text, then tap Copy."); ta.setAttribute("readonly",""); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fallback); else fallback();
}
function downloadWork(){
  const blob = new Blob([resultsText() + "\n"], { type: "text/plain" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = CODE + "-" + (state.name.replace(/[^\w]+/g,"-") || "student") + ".txt";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
  toast("💾 Your work was downloaded.");
}

/* ===== Events ===== */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]"); if (!el) return;
  const d = el.dataset, act = d.act, r = state.r;
  const locked = r.status === "done";                       // one try: no edits after submitting
  switch (act){
    case "start": {
      const v = (document.getElementById("nm")||{}).value || "";
      if (!v.trim()){ document.getElementById("wmsg").textContent = "👆 Type your name first."; return; }
      beginPlayer(v); break; }
    case "continue": beginPlayer(lsGet(PREFIX+"last")||""); break;
    case "home": state.view = "home"; state.confirmSubmit = false; render(); break;
    case "exit": save(); state.view = "home"; state.confirmSubmit = false; render(); toast("💾 Saved. You can continue later."); break;
    case "open":
      if (r.status === "done"){ state.view = "results"; render(); }
      else if (r.status === "new"){ state.view = "directions"; render(); }
      else { state.view = "test"; render({ nav:true }); }
      break;
    case "begin": if (locked) return; r.status = "progress"; r.idx = 0; save(); state.view = "test"; render({ nav:true }); break;
    case "results": state.view = "results"; render(); break;
    case "cert": state.view = "cert"; render(); confetti(30); break;
    case "print": window.print(); break;
    case "goto": if (locked) return; nav(+d.i); break;
    case "prev": if (locked) return; if (r.idx > 0) nav(r.idx - 1); break;
    case "next": if (locked) return; if (r.idx < ITEMS.length - 1) nav(r.idx + 1); break;
    case "review": if (locked) return; state.view = "review"; state.confirmSubmit = false; save(); render(); break;
    case "back-test": if (locked) return; nav(r.idx); break;
    case "submit-ask": case "w-submit-ask": if (locked) return; state.confirmSubmit = true; render({keepScroll:true, keepPane:true, keepQ:true}); break;
    case "submit-no": case "w-submit-no": state.confirmSubmit = false; render({keepScroll:true, keepPane:true, keepQ:true}); break;
    case "submit-yes": case "w-submit-yes": submitMission(); break;
    case "flag": if (locked) return; r.flags[r.idx] = !r.flags[r.idx]; pickRender(); break;
    case "strike": {
      if (locked) return; const k = d.i + "." + d.p, o = +d.o, a = r.strike[k] || [];
      r.strike[k] = a.includes(o) ? a.filter(x=>x!==o) : a.concat(o); pickRender(); break; }
    case "pick": {
      if (locked) return; const i = +d.i, p = +d.p, o = +d.o, it = ITEMS[i];
      if (it.type === "mc") r.ans[i] = o;
      else if (it.type === "ebsr"){ const a = Array.isArray(r.ans[i]) ? r.ans[i] : [null,null]; a[p] = o; r.ans[i] = a; }
      else if (it.type === "ms"){
        let a = Array.isArray(r.ans[i]) ? r.ans[i] : [];
        if (a.includes(o)) a = a.filter(x=>x!==o); else { a = a.concat(o); if (a.length > it.n) a = a.slice(a.length - it.n); }
        r.ans[i] = a;
      }
      pickRender(); break; }
    case "cell": {
      if (locked) return; const i = +d.i, it = ITEMS[i];
      const a = Array.isArray(r.ans[i]) ? r.ans[i] : it.rows.map(()=>null); a[+d.r] = +d.c; r.ans[i] = a; pickRender(); break; }
    case "hot": {
      if (locked) return; const i = r.idx, it = ITEMS[i];
      const s = +d.s, n = it.n || 1; let a = Array.isArray(r.ans[i]) ? r.ans[i] : [];
      if (a.includes(s)) a = a.filter(x=>x!==s); else { a = a.concat(s); if (a.length > n) a = a.slice(a.length - n); }
      r.ans[i] = a; pickRender(); break; }
    case "w-self": if (locked) return; r.write.self[+d.k] = !r.write.self[+d.k]; pickRender(); break;
    case "settings": state.showSettings = !state.showSettings; render({keepScroll:true, keepPane:true, keepQ:true}); break;
    case "rate": settings.rate = +d.v; saveSettings(); render({keepScroll:true, keepPane:true, keepQ:true}); speak("This is how fast I will read to you."); break;
    case "toggle-auto": settings.auto = !settings.auto; saveSettings(); render({keepScroll:true, keepPane:true, keepQ:true}); break;
    case "fs+": settings.fs = Math.min(1.5, Math.round((settings.fs + 0.1)*10)/10); saveSettings(); render({keepScroll:true, keepPane:true, keepQ:true}); break;
    case "fs-": settings.fs = Math.max(0.9, Math.round((settings.fs - 0.1)*10)/10); saveSettings(); render({keepScroll:true, keepPane:true, keepQ:true}); break;
    case "say-test": speak("Hi! This is how I sound when I read to you."); break;
    case "say-passage": speak(passageSpeech()); break;
    case "say-q": speak(questionSpeech(r.idx)); break;
    case "say-prompt": speak("Your writing task. " + CONFIG.prompt); break;
    case "say-draft": speak(r.write.text ? r.write.text : "You have not written anything yet."); break;
    case "say-essay": speak(r.res && r.res.text ? r.res.text : "Nothing written."); break;
    case "stop": stopSpeech(); break;
    case "copy": copyResults(); break;
    case "download": downloadWork(); break;
    case "tresetgo": { const v = ((document.getElementById("trc")||{}).value||"").trim().toLowerCase(); if (v === "unlock"){ try { localStorage.removeItem(pkey(state.name)); localStorage.removeItem(PREFIX+"last"); } catch(e){} location.reload(); } else { alert("That code is not right."); } break; }
    case "switch": save(); state.name = ""; state.r = freshRec(); state.badges = []; state.usedTTS = false; state.showSettings = false; state.view = "welcome"; state.reward = null; render(); break;
  }
});
document.addEventListener("input", e=>{
  if (!IS_W) return; const id = e.target.id, r = state.r; if (r.status === "done") return;     // one try: locked after submit
  if (id === "essay"){
    r.write.text = e.target.value;
    const el = document.getElementById("wc"); if (el) el.textContent = countWords(e.target.value) + " words";
    schedSave();
  } else if (/^plan\d$/.test(id)){ r.write.plan[+id.slice(4)] = e.target.value; schedSave(); }
});
document.addEventListener("keydown", e=>{ if (e.key === "Enter" && e.target.id === "nm"){ e.preventDefault(); const b = document.querySelector('[data-act="start"]'); if (b) b.click(); } });

render();
try { const lp = lsGet(PREFIX+"last"); if (lp && lsGet(pkey(lp))) beginPlayer(lp); } catch(e){}
</script>
